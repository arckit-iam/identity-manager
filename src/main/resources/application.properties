spring.application.name=identity-manager
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8083}
arc.publisher.url=${ARC_PUBLISHER_URL:http://arc-publisher:8081}
arc.publisher.target-system=${ARC_PUBLISHER_TARGET_SYSTEM:ad://DC01}
arc.publisher.source=${ARC_PUBLISHER_SOURCE:identity-manager}

# Validation des jetons JWT emis par arc-auth (cles publiques recuperees a la demande).
# issuer-uri : valeur attendue de iss, obligatoire (aucune decouverte OIDC avec jwk-set-uri).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ARC_SECURITY_JWK_SET_URI:http://arc-auth:8082/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ARC_SECURITY_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ARC_SECURITY_AUDIENCE:arc}

# Compte de service utilise pour appeler arc-publisher (role ARC_PUBLISHER).
arc.auth.url=${ARC_AUTH_URL:http://arc-auth:8082}
arc.auth.username=${ARC_AUTH_USERNAME}
arc.auth.password=${ARC_AUTH_PASSWORD}

# Decouverte des comptes utilisateurs dans les evenements consolides (desactivee par defaut).
arc.discovery.enabled=${ARC_DISCOVERY_ENABLED:false}
arc.discovery.topic=${ARC_DISCOVERY_TOPIC:arc.sync.identity}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:identity-manager}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Types de compte (nom, nature USER, regex a groupe nomme identity, metadonnees).
# Definis par le deploiement, ex. ARC_ACCOUNTS_TYPES_0_NAME, ARC_ACCOUNTS_TYPES_0_KIND, ARC_ACCOUNTS_TYPES_0_PATTERN.
# arc.accounts.types[0].name=standard-user
